global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── FastAPI app ─────────────────────────────────────────────────────────────
  - job_name: "voxintel_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # ── Celery worker (prometheus_client expose on 9100) ───────────────────────
  - job_name: "voxintel_worker"
    static_configs:
      - targets: ["worker:9100"]
    metrics_path: /metrics

  # ── Postgres exporter ───────────────────────────────────────────────────────
  # Deploy: postgres-exporter (quay.io/prometheuscommunity/postgres-exporter)
  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Redis exporter ──────────────────────────────────────────────────────────
  # Deploy: redis-exporter (oliver006/redis_exporter)
  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Qdrant built-in metrics ─────────────────────────────────────────────────
  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  # ── Prometheus self-scrape ──────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
